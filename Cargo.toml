[package]
name = "npzsee"
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
default-run = "npzsee-backend"
license = "GPL-3.0-or-later"
description = "Headless Rust core for the NPZSee multidimensional NumPy viewer"
repository = "https://github.com/terenceyjh/NPZSee-vscode"

[lib]
path = "native/src/lib.rs"

[[bin]]
name = "npzsee-backend"
path = "native/src/backend.rs"

[[bin]]
name = "npzsee-bench"
path = "native/src/bench.rs"
required-features = ["bench"]

[features]
bench = []

[dependencies]
anyhow = "1.0"
half = "2.7"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

